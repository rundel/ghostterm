name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
      - run: ./scripts/fetch-wasm.sh
      - run: bun run fmt
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
