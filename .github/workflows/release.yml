name: release

# Pushed by `bun run release <version>`. ghostterm is experimental, so every tag is published as a
# GitHub prerelease, plain (v0.2.0) or suffixed (v0.2.0-rc.1). The build runs with read access
# only; just the publish job can write to the repository.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag
        id: tag
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a vX.Y.Z or vX.Y.Z-suffix tag"; exit 1
          fi
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::package.json version $PKG_VERSION does not match $TAG"; exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG is not on main"; exit 1
          fi
          # Every release is a prerelease for now; restore the suffix test to publish full releases:
          # [[ "$VERSION" == *-* ]] && PRERELEASE=true || PRERELEASE=false
          PRERELEASE=true
          {
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
            echo "libghostty=$(node -p "require('./package.json')['libghostty-vt']")"
          } >> "$GITHUB_OUTPUT"

      # No cache in a job that builds what gets published.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      - run: bun install --frozen-lockfile
      - run: ./scripts/fetch-wasm.sh
      - run: bun run fmt
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

      - name: Package
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          mkdir release
          npm pack --pack-destination release
          (cd dist && zip -qr "../release/ghostterm-$VERSION-dist.zip" .)
          (cd release && sha256sum -- * > SHA256SUMS)
          ls -l release

      - name: Write the release notes
        env:
          LIBGHOSTTY: ${{ steps.tag.outputs.libghostty }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "Built on libghostty-vt $LIBGHOSTTY."
            echo
            bun scripts/changelog.ts notes "$VERSION"
          } > notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            release/
            notes.md
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          FLAGS=(--latest)
          [ "$PRERELEASE" = true ] && FLAGS=(--prerelease --latest=false)
          # --generate-notes appends GitHub's compare link (and any merged pull requests).
          gh release create "$TAG" release/* \
            --verify-tag \
            --title "$TAG" \
            --notes-file notes.md \
            --generate-notes \
            "${FLAGS[@]}"
