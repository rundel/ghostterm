<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ghostterm e2e fixture</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        background: #202020;
      }
      #terminal {
        display: inline-block;
        padding: 10px;
        background: #000000;
      }
      #before {
        display: block;
        margin-bottom: 10px;
      }
      /* With ?fit: the terminal fills a flex column whose size the specs change. */
      body.fit #frame {
        display: flex;
        flex-direction: column;
        width: 600px;
        height: 300px;
      }
      body.fit #terminal {
        display: block;
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <input id="before" aria-label="Before the terminal" />
    <div id="frame"><div id="terminal"></div></div>
    <script type="module" src="./fixture.ts"></script>
  </body>
</html>
